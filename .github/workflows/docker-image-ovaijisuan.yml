name: Publish Docker image (ovaijisuan)

on:
  push:
    tags:
      - 'v*'
      - '!*-alpha*'
  workflow_dispatch:
    inputs:
      name:
        description: "reason"
        required: false

jobs:
  prepare:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Determine ovaijisuan version
        id: version
        run: |
          UPSTREAM=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          [ -z "$UPSTREAM" ] && UPSTREAM="custom"
          SHA=$(git rev-parse --short=8 HEAD)
          VERSION="${UPSTREAM}-ovaijisuan-$(date -u +'%Y%m%d')-${SHA}"
          echo "value=$VERSION" >> $GITHUB_OUTPUT
          echo "Computed version: $VERSION"

  build_single_arch:
    name: Build & push (${{ matrix.arch }}) [native]
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out (shallow)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Write VERSION file
        run: |
          echo "$VERSION" > VERSION
          echo "Publishing version: $VERSION for ${{ matrix.arch }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to ACR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & push single-arch
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            arronlee/new-api:latest-${{ matrix.arch }}
            arronlee/new-api:ovaijisuan-${{ matrix.arch }}
            arronlee/new-api:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
            ${{ secrets.ACR_REGISTRY }}/reputationly/new-api:latest-${{ matrix.arch }}
            ${{ secrets.ACR_REGISTRY }}/reputationly/new-api:ovaijisuan-${{ matrix.arch }}
            ${{ secrets.ACR_REGISTRY }}/reputationly/new-api:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
          cache-from: type=gha
          # mode=min,不是 max。GHA 缓存每仓库上限 10 GB,而 mode=max 会把 5 个
          # builder stage 的每一层(含各自的 node_modules)全导出去,单次约 2.3 GB
          # ——四五次就顶满,之后每次新建都在踢掉下次要用的层,构建时间从 ~9 分钟
          # 涨到 25 分钟以上,且不会自愈。
          #
          # 代价很小:Dockerfile 里 default / classic / mobile 三个 stage 都是
          # `COPY ./VERSION .` 后紧跟 `bun run build`,而 VERSION 每次 run 现算
          # (日期+SHA)必变;builder2 的 `COPY . .` 同理。也就是说这些 stage 本来
          # 就每次全冷,mode=max 多存的那几个 GB 基本没人读。
          #
          # 真正被牺牲掉的只有 `bun install` / `go mod download` 这几层的跨次复用。
          # 若日后发现这部分冷启动明显拖时间,下一步是换 registry 缓存
          # (type=registry,ref=<ACR>/...:buildcache,mode=max):没有配额、且每次覆盖
          # 同一个 tag,不会像 GHA 缓存这样无限累积。
          cache-to: type=gha,mode=min
          # 必须关掉,别"顺手补上供应链证明"——补回去出包立刻再挂一次。
          #
          # 开着的话 buildx 会额外导出 attestation manifest,其 config 用 OCI 空描述符
          # application/vnd.oci.empty.v1+json。Docker Hub 认,阿里云 ACR 不认:
          #   denied: unknown manifest class for application/vnd.oci.empty.v1+json
          # 镜像本身构建成功、Docker Hub 三个 tag 也全推上去了,倒在推 ACR 那一步。
          #
          # 这不是我们改坏的:2026-08-12 09:46 那次成功跑的是一模一样的 buildx 参数,
          # 10:02 起开始失败,期间 .github/workflows/ 没有任何提交 —— ACR 侧对 OCI 1.1
          # artifact 的支持变了。想恢复证明就得拆成两个 build-push step(Docker Hub 带、
          # ACR 不带),为一份当前没人验的声明换构建复杂度,不值。
          #
          # 丢的不是镜像完整性(digest 照常校验),是两份旁挂声明:provenance 用于准入
          # 控制(cosign / Kyverno 验"是不是我们 CI 构建的"),当前没有任何一环在验;
          # SBOM 只是让扫描器省掉解包,Trivy / Grype / Scout 不依赖它,照样能扫。
          provenance: false
          sbom: false

      - name: Output digest
        run: |
          echo "### Docker Image Digest (${{ matrix.arch }})" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "arronlee/new-api:ovaijisuan-${{ matrix.arch }}" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  create_manifests:
    name: Create multi-arch manifests
    needs: [prepare, build_single_arch]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to ACR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Create & push manifest (Docker Hub - latest)
        run: |
          docker buildx imagetools create \
            -t arronlee/new-api:latest \
            arronlee/new-api:latest-amd64 \
            arronlee/new-api:latest-arm64

      - name: Create & push manifest (Docker Hub - ovaijisuan)
        run: |
          docker buildx imagetools create \
            -t arronlee/new-api:ovaijisuan \
            arronlee/new-api:ovaijisuan-amd64 \
            arronlee/new-api:ovaijisuan-arm64

      - name: Create & push manifest (Docker Hub - versioned)
        run: |
          docker buildx imagetools create \
            -t arronlee/new-api:${VERSION} \
            arronlee/new-api:${VERSION}-amd64 \
            arronlee/new-api:${VERSION}-arm64

      - name: Create & push manifest (ACR - latest)
        run: |
          docker buildx imagetools create \
            -t ${{ secrets.ACR_REGISTRY }}/reputationly/new-api:latest \
            ${{ secrets.ACR_REGISTRY }}/reputationly/new-api:latest-amd64 \
            ${{ secrets.ACR_REGISTRY }}/reputationly/new-api:latest-arm64

      - name: Create & push manifest (ACR - ovaijisuan)
        run: |
          docker buildx imagetools create \
            -t ${{ secrets.ACR_REGISTRY }}/reputationly/new-api:ovaijisuan \
            ${{ secrets.ACR_REGISTRY }}/reputationly/new-api:ovaijisuan-amd64 \
            ${{ secrets.ACR_REGISTRY }}/reputationly/new-api:ovaijisuan-arm64

      - name: Create & push manifest (ACR - versioned)
        run: |
          docker buildx imagetools create \
            -t ${{ secrets.ACR_REGISTRY }}/reputationly/new-api:${VERSION} \
            ${{ secrets.ACR_REGISTRY }}/reputationly/new-api:${VERSION}-amd64 \
            ${{ secrets.ACR_REGISTRY }}/reputationly/new-api:${VERSION}-arm64

      - name: Output manifest digest
        run: |
          echo "### Multi-arch Manifest Digests" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker buildx imagetools inspect arronlee/new-api:ovaijisuan >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  create_release:
    name: Create GitHub Release
    needs: [prepare, create_manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cat > notes.md << EOF
          ## Docker 镜像

          **固定 tag（始终最新）：**
          \`\`\`
          docker pull arronlee/new-api:ovaijisuan
          \`\`\`

          **本次版本 tag：**
          \`\`\`
          docker pull arronlee/new-api:${VERSION}
          \`\`\`

          > ACR 镜像同步推送，国内服务器建议使用 ACR 地址拉取。
          EOF

          gh release create "${VERSION}" \
            --repo "${{ github.repository }}" \
            --title "${VERSION}" \
            --notes-file notes.md
